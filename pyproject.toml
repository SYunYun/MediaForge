[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "mediaforge"
version = "0.1.0"
description = "Agent-native media stack toolbox (module 1: hunt / Cardigann interpreter)"
requires-python = ">=3.10"
dependencies = [
    "requests",
    "pyyaml",
    "beautifulsoup4",
]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
